
name: Build Logger AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Code Studio
        uses: actions/checkout@v4
        with:
          repository: AndroidCSOfficial/android-code-studio
          ref: 24cf7fe
          submodules: recursive
          path: acs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Build logger AAR
        working-directory: acs
        run: chmod +x gradlew && ./gradlew :external:logwire:bundleReleaseAar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: logger-runtime
          path: acs/external/logwire/build/outputs/aar/logger-runtime.aar
